<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Study Helper App</title>

<link rel="manifest" href="manifest.json">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #eef2ff, #f8fafc);
}

/* NAVBAR */
.navbar {
  background: #4f46e5;
  color: white;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 3px 10px rgba(0,0,0,0.2);
}

.navbar h1 {
  font-size: 20px;
}

.navbar ul {
  list-style: none;
  display: flex;
  gap: 15px;
}

.navbar ul li {
  cursor: pointer;
  transition: 0.3s;
}

.navbar ul li:hover {
  opacity: 0.8;
}

/* CONTAINER */
.container {
  padding: 25px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}

/* CARD */
.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
  transition: 0.3s ease;
  animation: fadeIn 0.6s ease-in-out;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}

h2 {
  margin-bottom: 10px;
  color: #4f46e5;
}

input {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  border-radius: 6px;
  border: 1px solid #ccc;
  outline: none;
  transition: 0.3s;
}

input:focus {
  border-color: #4f46e5;
  box-shadow: 0 0 5px rgba(79,70,229,0.3);
}

button {
  padding: 8px 12px;
  margin-top: 5px;
  border: none;
  background: #4f46e5;
  color: white;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #4338ca;
  transform: scale(1.05);
}

button:active {
  transform: scale(0.95);
}

pre {
  margin-top: 10px;
  background: #eef2ff;
  padding: 10px;
  border-radius: 6px;
}

p {
  margin-top: 10px;
  font-weight: 500;
}

/* ANIMATION */
@keyframes fadeIn {
  from {opacity: 0; transform: translateY(10px);}
  to {opacity: 1; transform: translateY(0);}
}

/* MOBILE NAV */
@media (max-width: 600px) {
  .navbar {
    flex-direction: column;
    gap: 10px;
  }
}
</style>
</head>

<body>

<div class="navbar">
  <h1>📘 Study Helper</h1>
  <ul>
    <li>Home</li>
    <li>Tools</li>
    <li>About</li>
  </ul>
</div>

<div class="container">

  <div class="card">
    <h2>Table Generator</h2>
    <input type="number" id="tableNum" placeholder="Enter number">
    <button onclick="generateTable()">Generate</button>
    <pre id="tableResult"></pre>
  </div>

  <div class="card">
    <h2>Days ↔ Hours</h2>
    <input type="number" id="days" placeholder="Days">
    <button onclick="daysToHours()">Days → Hours</button>

    <input type="number" id="hours" placeholder="Hours">
    <button onclick="hoursToDays()">Hours → Days</button>
    <p id="dayHourResult"></p>
  </div>

  <div class="card">
    <h2>Meter ↔ Kilometer</h2>
    <input type="number" id="meters" placeholder="Meters">
    <button onclick="mToKm()">M → KM</button>

    <input type="number" id="kms" placeholder="Kilometers">
    <button onclick="kmToM()">KM → M</button>
    <p id="mkResult"></p>
  </div>

  <div class="card">
    <h2>CM ↔ M</h2>
    <input type="number" id="cms" placeholder="Centimeters">
    <button onclick="cmToM()">CM → M</button>

    <input type="number" id="ms" placeholder="Meters">
    <button onclick="mToCm()">M → CM</button>
    <p id="cmResult"></p>
  </div>

  <div class="card">
    <h2>Hours + Minutes → Minutes</h2>
    <input type="number" id="h" placeholder="Hours">
    <input type="number" id="min" placeholder="Minutes">
    <button onclick="toMinutes()">Convert</button>
    <p id="minResult"></p>
  </div>

</div>

<script>
function showError(elementId, message) {
  document.getElementById(elementId).textContent = message;
}

function generateTable() {
  let num = document.getElementById("tableNum").value;
  if (num === "") {
    showError("tableResult", "⚠ Please enter a valid number");
    return;
  }

  num = Number(num);
  let result = "";

  for (let i = 1; i <= 10; i++) {
    result += `${num} x ${i} = ${num * i}\n`;
  }

  document.getElementById("tableResult").textContent = result;
}

function daysToHours() {
  let days = document.getElementById("days").value;
  if (days === "") return showError("dayHourResult", "Enter days");
  days = Number(days);
  document.getElementById("dayHourResult").textContent =
    `${days} days = ${days * 24} hours`;
}

function hoursToDays() {
  let hours = document.getElementById("hours").value;
  if (hours === "") return showError("dayHourResult", "Enter hours");
  hours = Number(hours);
  document.getElementById("dayHourResult").textContent =
    `${hours} hours = ${(hours / 24).toFixed(2)} days`;
}

function mToKm() {
  let m = document.getElementById("meters").value;
  if (m === "") return showError("mkResult", "Enter meters");
  m = Number(m);
  document.getElementById("mkResult").textContent =
    `${m} meters = ${(m / 1000).toFixed(3)} km`;
}

function kmToM() {
  let km = document.getElementById("kms").value;
  if (km === "") return showError("mkResult", "Enter kilometers");
  km = Number(km);
  document.getElementById("mkResult").textContent =
    `${km} km = ${km * 1000} meters`;
}

function cmToM() {
  let cm = document.getElementById("cms").value;
  if (cm === "") return showError("cmResult", "Enter centimeters");
  cm = Number(cm);
  document.getElementById("cmResult").textContent =
    `${cm} cm = ${(cm / 100).toFixed(2)} m`;
}

function mToCm() {
  let m = document.getElementById("ms").value;
  if (m === "") return showError("cmResult", "Enter meters");
  m = Number(m);
  document.getElementById("cmResult").textContent =
    `${m} m = ${m * 100} cm`;
}

function toMinutes() {
  let h = document.getElementById("h").value;
  let min = document.getElementById("min").value;

  if (h === "" && min === "")
    return showError("minResult", "Enter hours or minutes");

  h = Number(h || 0);
  min = Number(min || 0);

  document.getElementById("minResult").textContent =
    `Total Minutes = ${(h * 60) + min}`;
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
