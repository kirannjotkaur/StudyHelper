<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Helper Pro</title>

<style>
:root {
  --bg: #f3f4f6;
  --card: #ffffff;
  --text: #111827;
  --primary: linear-gradient(45deg,#4f46e5,#9333ea);
}

body.dark {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f1f5f9;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  transition:0.3s;
}

/* NAVBAR */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 20px;
  background:var(--primary);
  color:white;
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.menu{
  display:flex;
  gap:20px;
}

.menu a{
  color:white;
  text-decoration:none;
}

.hamburger{
  display:none;
  font-size:24px;
  cursor:pointer;
}

/* MOBILE */
@media(max-width:768px){
  .menu{
    position:absolute;
    top:60px;
    right:0;
    background:#4f46e5;
    flex-direction:column;
    width:200px;
    padding:15px;
    display:none;
  }
  .menu.show{
    display:flex;
  }
  .hamburger{
    display:block;
  }
}

/* CONTAINER */
.container{
  padding:30px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

/* CARD */
.card{
  background:var(--card);
  padding:20px;
  border-radius:15px;
  box-shadow:0 8px 25px rgba(0,0,0,0.08);
  transition:0.3s;
  animation:fadeIn 0.6s ease;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 12px 30px rgba(0,0,0,0.15);
}

h2{
  margin-bottom:10px;
}

/* INPUT */
input{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

/* BUTTON */
button{
  padding:10px 15px;
  border:none;
  border-radius:8px;
  background:var(--primary);
  color:white;
  cursor:pointer;
  margin-top:5px;
  transition:0.3s;
  background-size:200% auto;
}

button:hover{
  background-position:right center;
  transform:scale(1.05);
}

button:active{
  transform:scale(0.95);
}

/* CALCULATOR */
.calc-buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.calc-buttons button{
  padding:15px;
  font-size:16px;
}

.calc-display{
  width:100%;
  padding:10px;
  font-size:18px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

/* ANIMATION */
@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="navbar">
  <div class="logo">📘 Study Helper Pro</div>
  <div class="menu" id="menu">
    <a href="#">Home</a>
    <a href="#">Tools</a>
    <a href="#">About</a>
    <a href="#" onclick="toggleDark()">🌙</a>
  </div>
  <div class="hamburger" onclick="toggleMenu()">☰</div>
</div>

<div class="container">

  <!-- TABLE -->
  <div class="card">
    <h2>Table Generator</h2>
    <input type="number" id="tableNum" placeholder="Enter number">
    <button onclick="generateTable()">Generate</button>
    <pre id="tableResult"></pre>
  </div>

  <!-- CALCULATOR -->
  <div class="card">
    <h2>Calculator</h2>
    <input type="text" id="calcDisplay" class="calc-display" readonly>
    <div class="calc-buttons">
      <button onclick="press('7')">7</button>
      <button onclick="press('8')">8</button>
      <button onclick="press('9')">9</button>
      <button onclick="press('/')">÷</button>

      <button onclick="press('4')">4</button>
      <button onclick="press('5')">5</button>
      <button onclick="press('6')">6</button>
      <button onclick="press('*')">×</button>

      <button onclick="press('1')">1</button>
      <button onclick="press('2')">2</button>
      <button onclick="press('3')">3</button>
      <button onclick="press('-')">−</button>

      <button onclick="press('0')">0</button>
      <button onclick="press('.')">.</button>
      <button onclick="calculate()">=</button>
      <button onclick="press('+')">+</button>

      <button onclick="clearCalc()" style="grid-column: span 4; background:#ef4444;">Clear</button>
    </div>
  </div>

</div>

<script>
function toggleMenu(){
  document.getElementById("menu").classList.toggle("show");
}

function toggleDark(){
  document.body.classList.toggle("dark");
}

function generateTable(){
  let num=document.getElementById("tableNum").value;
  if(num==="") return alert("Enter number");
  num=Number(num);
  let result="";
  for(let i=1;i<=10;i++){
    result+=`${num} x ${i} = ${num*i}\n`;
  }
  document.getElementById("tableResult").textContent=result;
}

/* Calculator */
function press(val){
  document.getElementById("calcDisplay").value+=val;
}

function calculate(){
  try{
    document.getElementById("calcDisplay").value=
    eval(document.getElementById("calcDisplay").value);
  }catch{
    alert("Invalid Calculation");
  }
}

function clearCalc(){
  document.getElementById("calcDisplay").value="";
}
</script>

</body>
</html>
